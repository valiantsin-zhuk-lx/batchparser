# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: batch.parser
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: batch.parser
        ui5Theme: sap_horizon
builder:
  resources:
    excludes:
      - "/test/**"
      - "!/test/flpSandbox.html"
  bundles:
    - name: batch/parser/Component-preload.js
      defaultFileTypes:
        - .js
      sections:
        - mode: preload
          filters:
            - batch/parser/
      resolve: true
      optimize: true
